name: aios

x-aios-image: &aios-image
  image: ${AIOS_IMAGE:-aios:local}
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      AIOS_UID: ${AIOS_UID:-1000}
      AIOS_GID: ${AIOS_GID:-1000}
      OPA_VERSION: ${OPA_VERSION:-0.63.0}

services:
  core:
    <<: *aios-image
    init: true
    restart: unless-stopped
    command: ["aiosd"]
    env_file:
      - path: .env
        required: false
    environment:
      AIOS_API_HOST: 0.0.0.0
      AIOS_API_PORT: "8000"
      AIOS_API_URL: http://core:8000
      AIOS_POLICY_DIR: /app/aios/policies
      AIOS_OPA_BINARY: /usr/local/bin/opa
      AIOS_QUARANTINE_DIR: /state/quarantine
      AIOS_LEDGER_PATH: /state/ledger.jsonl
    ports:
      # Keep the unauthenticated API on the host loopback only.
      - "127.0.0.1:${AIOS_API_PORT:-8000}:8000"
    volumes:
      - aios-state:/state
      # Uncomment to clean files under a host directory:
      # - ${AIOS_WORKSPACE:-./workspace}:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Optional, interactive planner. It is not started by `up`; use:
  #   docker compose run --rm planner python -m aios.ai "..."
  planner:
    <<: *aios-image
    profiles: ["planner"]
    init: true
    depends_on:
      core:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      AIOS_API_URL: http://core:8000
      # A host Ollama listening on 127.0.0.1 is not reachable from a container.
      AIOS_OLLAMA_URL: ${AIOS_OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "aios.ai", "--help"]

volumes:
  aios-state:
