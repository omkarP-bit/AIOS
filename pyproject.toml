[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.6.0"
description = "AIOS — local-first AI operating system control plane with capability security and reversible actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
aios = "aios.cli.main:run"

[tool.setuptools.packages.find]
include = ["aios*"]

[tool.setuptools.package-data]
aios = ["policies/*.rego", "policies/*.json", "telemetry/*.bt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "S104", "S108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Fixture generator contains wide literal tables that mirror kernel output.
"tests/fixtures/generate.py" = ["E501"]
